<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Inter, system-ui, sans-serif">
  <rect width="1200" height="380" rx="16" fill="#09090b"/>
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#27272a" stroke-width="2"/>
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#f4f4f5">How AI flows: therapist drafts, approves, client lives it</text>

  <!-- Therapist column -->
  <rect x="40" y="70" width="320" height="270" rx="12" fill="#0b1514" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="200" y="98" text-anchor="middle" font-size="14" font-weight="800" fill="#14b8a6">THERAPIST RUNS THE TOOLS</text>
  <rect x="60" y="115" width="280" height="52" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="200" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f4f5">Prescribes in shorthand</text>
  <text x="200" y="155" text-anchor="middle" font-size="11" fill="#a1a1aa">Draft with Agent per step</text>
  <rect x="60" y="178" width="280" height="52" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="200" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f4f5">Reviews every AI draft</text>
  <text x="200" y="218" text-anchor="middle" font-size="11" fill="#a1a1aa">Angles, goals, highlights, SOAP</text>
  <rect x="60" y="241" width="280" height="52" rx="8" fill="#14b8a6"/>
  <text x="200" y="263" text-anchor="middle" font-size="13" font-weight="800" fill="#09090b">Taps Approve / Publish</text>
  <text x="200" y="281" text-anchor="middle" font-size="11" fill="#09090b">Nothing ships without this</text>

  <!-- AI column -->
  <rect x="440" y="70" width="320" height="270" rx="12" fill="#141021" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="600" y="98" text-anchor="middle" font-size="14" font-weight="800" fill="#8b5cf6">AI DRAFTS, NEVER DECIDES</text>
  <rect x="460" y="115" width="280" height="52" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="600" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f4f5">Spark reasons + drafts</text>
  <text x="600" y="155" text-anchor="middle" font-size="11" fill="#a1a1aa">Steps, verdicts, summaries</text>
  <rect x="460" y="178" width="280" height="52" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="600" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f4f5">SAM 3.1 + 3D Body measure</text>
  <text x="600" y="218" text-anchor="middle" font-size="11" fill="#a1a1aa">Digital movement twin per patient</text>
  <rect x="460" y="241" width="280" height="52" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="600" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f4f5">Grounds + cites sources</text>
  <text x="600" y="281" text-anchor="middle" font-size="11" fill="#a1a1aa">Send-to-clinician gate</text>

  <!-- Client column -->
  <rect x="840" y="70" width="320" height="270" rx="12" fill="#160f14" stroke="#f472b6" stroke-width="1.5"/>
  <text x="1000" y="98" text-anchor="middle" font-size="14" font-weight="800" fill="#f472b6">CLIENT LIVES THE PRACTICE</text>
  <rect x="860" y="115" width="280" height="52" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="1000" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f4f5">Practices + records video</text>
  <text x="1000" y="155" text-anchor="middle" font-size="11" fill="#a1a1aa">Worksheet only if attached</text>
  <rect x="860" y="178" width="280" height="52" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="1000" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f4f5">Reads published feedback</text>
  <text x="1000" y="218" text-anchor="middle" font-size="11" fill="#a1a1aa">Plain words, goals, highlights</text>
  <rect x="860" y="241" width="280" height="52" rx="8" fill="#18181b" stroke="#27272a"/>
  <text x="1000" y="263" text-anchor="middle" font-size="13" font-weight="700" fill="#f4f4f5">Asks Aruga Guide</text>
  <text x="1000" y="281" text-anchor="middle" font-size="11" fill="#a1a1aa">Verified by clinician</text>

  <!-- arrows -->
  <line x1="360" y1="205" x2="440" y2="205" stroke="#71717a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="760" y1="205" x2="840" y2="205" stroke="#71717a" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#71717a"/></marker></defs>
  <text x="600" y="362" text-anchor="middle" font-size="12" fill="#71717a">Async by design — prescribe, practice, measure, publish. No appointments, no live video, no wearables.</text>
</svg>
